name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Test the data scripts
        run: pytest
      - name: Check the data and write the site's data files
        run: python scripts/build_data.py
        env:
          # RDE release 1.0.0 is marked internal-use-only in its own metadata
          # but was cleared for public distribution on 2026-10-27.
          RDE_ALLOW_INTERNAL: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Lint the site
        run: npm run lint
        working-directory: site
      - name: Test the site
        run: npm test
        working-directory: site
      - name: Build the site
        run: npm run build
        working-directory: site

      - name: Upload the built site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
